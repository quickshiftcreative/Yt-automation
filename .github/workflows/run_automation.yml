name: My automation YT - Quick Shift Creative (2 Long + 4 Shorts Pro)

on:
  schedule:
    - cron: '15 13 * * *'  # Slot 1: 8:15 AM EST  (6:45 PM IST)  | SHORT  - News Bulletin (Gaming/Tech/AI/Market)
    - cron: '15 16 * * *'  # Slot 2: 11:15 AM EST (9:45 PM IST)  | SHORT  - Trending Viral Topic
    - cron: '15 19 * * *'  # Slot 3: 2:15 PM EST  (12:45 AM IST) | LONG   - News Bulletin (8-10 min)
    - cron: '15 22 * * *'  # Slot 4: 5:15 PM EST  (3:45 AM IST)  | SHORT  - Trending Viral Topic
    - cron: '15 1 * * *'   # Slot 5: 8:15 PM EST  (6:45 AM IST)  | LONG   - High-RPM / Reach / Subscriber Growth
    - cron: '15 4 * * *'   # Slot 6: 11:15 PM EST (9:45 AM IST)  | SHORT  - High-RPM / Reach / Subscriber Short
  workflow_dispatch:
    inputs:
      content_mode:
        description: 'Content Pillar'
        required: true
        default: 'news_bulletin'
        type: choice
        options:
          - news_bulletin
          - trending_viral
          - deep_dive_evergreen
      video_format:
        description: 'Video Format'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - horizontal
          - shorts
      news_category:
        description: 'Focus Category (Optional)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - tech
          - ai
          - gaming
          - business_market
      voice_style:
        description: 'US Neural Voice Style'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - male_us
          - female_us
      privacy_status:
        description: 'YouTube Privacy (Manual Run)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - public
          - private
      custom_topic:
        description: 'Custom Topic (Leave blank for auto)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Bold Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Daily US Slot (2 Long + 4 Shorts)
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.content_mode }}
          IN_FORMAT: ${{ github.event.inputs.video_format }}
          IN_CATEGORY: ${{ github.event.inputs.news_category }}
          IN_VOICE: ${{ github.event.inputs.voice_style }}
          IN_PRIVACY: ${{ github.event.inputs.privacy_status }}
          IN_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "15 13 * * *")
                echo "VIDEO_FORMAT=shorts" >> $GITHUB_ENV
                echo "CONTENT_MODE=news_bulletin" >> $GITHUB_ENV
                echo "NEWS_CATEGORY=auto" >> $GITHUB_ENV
                ;;
              "15 16 * * *")
                echo "VIDEO_FORMAT=shorts" >> $GITHUB_ENV
                echo "CONTENT_MODE=trending_viral" >> $GITHUB_ENV
                echo "NEWS_CATEGORY=auto" >> $GITHUB_ENV
                ;;
              "15 19 * * *")
                echo "VIDEO_FORMAT=horizontal" >> $GITHUB_ENV
                echo "CONTENT_MODE=news_bulletin" >> $GITHUB_ENV
                echo "NEWS_CATEGORY=auto" >> $GITHUB_ENV
                ;;
              "15 22 * * *")
                echo "VIDEO_FORMAT=shorts" >> $GITHUB_ENV
                echo "CONTENT_MODE=trending_viral" >> $GITHUB_ENV
                echo "NEWS_CATEGORY=auto" >> $GITHUB_ENV
                ;;
              "15 1 * * *")
                echo "VIDEO_FORMAT=horizontal" >> $GITHUB_ENV
                echo "CONTENT_MODE=deep_dive_evergreen" >> $GITHUB_ENV
                echo "NEWS_CATEGORY=auto" >> $GITHUB_ENV
                ;;
              "15 4 * * *")
                echo "VIDEO_FORMAT=shorts" >> $GITHUB_ENV
                echo "CONTENT_MODE=deep_dive_evergreen" >> $GITHUB_ENV
                echo "NEWS_CATEGORY=auto" >> $GITHUB_ENV
                ;;
              *)
                echo "VIDEO_FORMAT=shorts" >> $GITHUB_ENV
                echo "CONTENT_MODE=news_bulletin" >> $GITHUB_ENV
                echo "NEWS_CATEGORY=auto" >> $GITHUB_ENV
                ;;
            esac
            echo "VOICE_STYLE=auto" >> $GITHUB_ENV
            echo "PRIVACY_STATUS=public" >> $GITHUB_ENV
            echo "CUSTOM_TOPIC=" >> $GITHUB_ENV
          else
            echo "VIDEO_FORMAT=${IN_FORMAT:-auto}" >> $GITHUB_ENV
            echo "CONTENT_MODE=${IN_MODE:-news_bulletin}" >> $GITHUB_ENV
            echo "NEWS_CATEGORY=${IN_CATEGORY:-auto}" >> $GITHUB_ENV
            echo "VOICE_STYLE=${IN_VOICE:-auto}" >> $GITHUB_ENV
            echo "PRIVACY_STATUS=${IN_PRIVACY:-unlisted}" >> $GITHUB_ENV
            echo "CUSTOM_TOPIC=${IN_TOPIC}" >> $GITHUB_ENV
          fi

      - name: Run My automation YT (Quick Shift Creative - Pro)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "Active Slot -> Format: $VIDEO_FORMAT | Mode: $CONTENT_MODE | Category: $NEWS_CATEGORY | Privacy: $PRIVACY_STATUS"
          python main.py

      - name: Save video history & self-learning memory
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Quick Shift Creative Bot"
          git add -f history.json strategy_memory.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update video history & self-learning memory" && git pull --rebase && git push)
