name: My automation YT - Quick Shift Creative (US Bulletin)

on:
  schedule:
    - cron: '15 13 * * *'  # 8:15 AM EST / 5:15 AM PST (US Morning)
    - cron: '15 16 * * *'  # 11:15 AM EST / 8:15 AM PST (West Coast Morning)
    - cron: '15 19 * * *'  # 2:15 PM EST / 11:15 AM PST (US Lunch)
    - cron: '15 22 * * *'  # 5:15 PM EST / 2:15 PM PST (After-Work Rush)
    - cron: '15 1 * * *'   # 8:15 PM EST / 5:15 PM PST (US Prime Time)
    - cron: '15 4 * * *'   # 11:15 PM EST / 8:15 PM PST (Late-Night Gamers)
  workflow_dispatch:
    inputs:
      news_category:
        description: 'US News Category'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - tech
          - ai
          - gaming
      video_format:
        description: 'Video Format'
        required: true
        default: 'horizontal'
        type: choice
        options:
          - horizontal
          - shorts
      voice_style:
        description: 'US Neural Voice Style'
        required: true
        default: 'male_us'
        type: choice
        options:
          - male_us
          - female_us
      privacy_status:
        description: 'YouTube Privacy (Manual Run)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - public
          - private
      custom_topic:
        description: 'Custom Topic (Optional - leave blank for auto US Trends)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Bold Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run My automation YT (Quick Shift Creative - US Edition)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          NEWS_CATEGORY: ${{ github.event.inputs.news_category || 'auto' }}
          VIDEO_FORMAT: ${{ github.event.inputs.video_format || 'horizontal' }}
          VOICE_STYLE: ${{ github.event.inputs.voice_style || 'male_us' }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
        run: python main.py

      - name: Save video history (prevent duplicate topics)
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Quick Shift Creative Bot"
          if [ -f history.json ]; then
            git add history.json
            git diff --cached --quiet || (git commit -m "chore: update published video history" && git pull --rebase && git push)
          fi
