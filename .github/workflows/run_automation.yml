name: My automation YT - Quick Shift Creative (US Bulletin)

on:
  schedule:
    # Runs automatically every day at US Prime Time: 4:00 PM EST / 1:00 PM PST (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      news_category:
        description: 'News Bulletin Focus'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - ai
          - tech
          - gaming
          - us_trends
      video_format:
        description: 'Video Format'
        required: true
        default: 'horizontal'
        type: choice
        options:
          - horizontal
          - shorts
      voice_style:
        description: 'US Neural Voice Anchor'
        required: true
        default: 'male_us'
        type: choice
        options:
          - male_us
          - deep_us
          - female_us
      privacy_status:
        description: 'YouTube Upload Privacy (Use unlisted for your first test!)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - public
          - private
      custom_topic:
        description: 'Optional Custom Topic (Leave blank for 100% Auto US/Global Trending)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Bold Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run My automation YT (Quick Shift Creative - US Edition)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          NEWS_CATEGORY: ${{ github.event.inputs.news_category || 'auto' }}
          VIDEO_FORMAT: ${{ github.event.inputs.video_format || 'horizontal' }}
          VOICE_STYLE: ${{ github.event.inputs.voice_style || 'male_us' }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
        run: python main.py

      - name: Save video history (prevent duplicate topics)
        run: |
          git config user.name "Quick Shift Creative Bot"
          git config user.email "bot@quickshiftcreative.local"
          git add history.json
          git diff --staged --quiet || (git commit -m "chore: update published US/Global bulletin history" && git push)
